openapi: 3.1.0
info:
  title: Emissary Auth API
  version: 1.0.0
  description: |-
    Authentication endpoints for Emissary. The token design is
    described in docs/AUTH.md.

    Login is form-based (username and password); support for other
    login types will be added later, as required. A successful login
    returns a pair of signed JWTs:

    - the **access token**, for general access and API calls, with a
      duration of 9 hours. It is presented as
      `Authorization: Bearer <token>` on all other endpoints. The
      following claims must always be present: `sub` - the email
      address of the user; `sid` - a session id (used to ensure strict
      access/refresh token stepping). In addition to standard claims,
      the JWT MAY have the following attributes: `Subscribed`
      (boolean), `Admin` (boolean), `EmissaryUserManagement`
      (boolean).
    - the **refresh token**, with a duration of 30 days. It is only
      ever sent to `POST /api/auth/refresh`, never as a bearer token.
      It must contain: `sub` - the email address of the user (used to
      double-check the session); `sid` - the session id; `issue` - the
      issue number of this refresh token. Strict ordering is enforced.

    `POST /api/auth/refresh` exchanges a refresh token for a new
    access token and a new refresh token with `issue` incremented by
    one; the exchanged refresh token is invalidated.

    Errors are returned as `{"error": "<message>"}` with a generic
    message; details are only logged server-side.
servers:
- url: https://{host}
  description: Emissary mail server host
  variables:
    host:
      default: mail.example.com
tags:
- name: Auth
  description: Token issuance and refresh
paths:
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Exchange credentials for an access token and a refresh token
      description: |-
        Form-based login. Authenticates the user against the
        configured user manager (the built-in administrator first,
        then the selected backend) and returns a pair of signed JWTs:
        an access token (9 hours) and a refresh token (30 days).
        When the backend is Emissary-mastered (it manages its own
        users; see docs/USERS.md), the password is checked against
        the user's stored salted password, and a disabled user is
        rejected with 403.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Issued access token and refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request (missing username or password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Valid credentials, but the user is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Exchange a refresh token for a new access token and refresh token
      description: |-
        Validates the presented refresh token - signature, expiry,
        session (`sid`), and strict ordering of `issue` - and returns
        a new access token and a new refresh token with `issue`
        incremented by one. The exchanged refresh token is
        invalidated; presenting it again (or presenting an older
        `issue` for the same session) is rejected with `401`.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Issued access token and refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request (missing refreshToken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid, expired or revoked refresh token, or an out-of-order issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from login or refresh
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          description: The user's login name (email address)
        password:
          type: string
          format: password
          minLength: 1
      additionalProperties: false
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: The refresh token issued by login or a previous refresh
      additionalProperties: false
    TokenResponse:
      type: object
      description: The pair of signed JWTs issued by login and refresh
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresAt
      properties:
        accessToken:
          type: string
          minLength: 1
          description: |-
            A signed JWT for general access and API calls, with a
            duration of 9 hours. Present it as
            `Authorization: Bearer <accessToken>` on other endpoints.
            The claims `sub` (the email address of the user) and
            `sid` (a session id, used to ensure strict
            access/refresh token stepping) must always be present.
            In addition to standard claims, the JWT MAY have the
            following attributes: `Subscribed` (boolean), `Admin`
            (boolean), `EmissaryUserManagement` (boolean).
        refreshToken:
          type: string
          minLength: 1
          description: |-
            A signed JWT with a duration of 30 days, exchanged at
            `/api/auth/refresh`. It must contain: `sub` - the email
            address of the user (used to double-check the session);
            `sid` - the session id; `issue` - the issue number of
            this refresh token. Strict ordering is enforced: each
            refresh issues a new token with `issue` incremented by
            one, and the exchanged token is invalidated.
        tokenType:
          type: string
          default: Bearer
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the access token (its `exp` claim)
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: A generic error message
      additionalProperties: false
