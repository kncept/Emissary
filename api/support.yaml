openapi: 3.1.0
info:
  title: Emissary Support API
  version: 1.0.0
  description: |-
    Administrative support and diagnostics endpoints for Emissary.

    Every operation in this document lives under the reserved URL prefix
    `/api/support/`. The prefix is owned exclusively by this document: it
    never defines operations outside the prefix, and no operation in any
    other document (notably `api/auth.yaml`, `api/user/` and `api/jmap.yaml`)
    may use a path under the prefix. This guarantees the documents never
    overlap. See "Specs and path ownership" in docs/API.md.

    Every operation requires a valid bearer token whose `systemManager` claim
    is true. The ordinary per-user visibility and data rules used elsewhere in
    the API do not apply: support endpoints expose server configuration and the
    raw contents of the inbound mail bucket, and `ProcessEmail` can move mail
    between the staging area and user mailboxes.

    Secrets (passwords, JWT signing secrets, LDAP bind passwords and AWS
    credentials) are never returned. Configuration responses only report
    whether a secret is configured.

    Error conventions (status codes, `{"error": "<message>"}` bodies,
    generic messages) are shared with the rest of the API - see
    docs/API.md. Full operational details are in docs/SUPPORT.md.
servers:
- url: https://{host}
  description: Emissary mail server host
  variables:
    host:
      default: mail.example.com
tags:
- name: Support
  description: Administrative support and diagnostics operations (System Managers only)
paths:
  /api/support/configurations:
    get:
      tags:
      - Support
      summary: List configuration sections and their implementations
      description: |-
        Returns every runtime configuration section together with the name of
        the implementation currently backing it (for example `s3`, `ddb`,
        `memory`, `filesystem`, `aws-ses`, `mta`, `log`, `none` or `ldap`).

        Use `GET /api/support/configurations/{name}` to fetch the full
        configuration details for one section.
      operationId: listConfigurations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The configured sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/configurations/{name}:
    get:
      tags:
      - Support
      summary: Get full details for one configuration section
      description: |-
        Returns the full configuration for a section. Names are case
        insensitive; the canonical names are `server`, `storage`, `sender`,
        `receiver`, `metadata`, `session`, `user-manager`.

        Secret values are replaced by booleans or descriptive markers (for
        example `passwordConfigured: true`); they are never returned.
      operationId: getConfiguration
      security:
      - bearerAuth: []
      parameters:
      - name: name
        in: path
        required: true
        description: Configuration section name
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: The configuration section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown configuration section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/bucket/root:
    get:
      tags:
      - Support
      summary: List the root contents of the mail bucket
      description: |-
        Lists the immediate contents of the configured S3 mail bucket. Root
        objects are the raw messages written by SES and not yet processed;
        common prefixes are the top-level virtual directories (normally
        `users/`).

        This operation is only available when `STORAGE=s3`. With any other
        storage backend it returns `501 Not Implemented`.
      operationId: listBucketRoot
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The bucket root contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketRootResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Bucket operations are not available for the configured storage backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The bucket could not be listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/process-email:
    post:
      tags:
      - Support
      summary: Process a staging email
      description: |-
        Runs the standard inbound processing pipeline on a raw staging object.
        The `id` is the object key reported by `GET /api/support/bucket/root`.

        Processing validates each recipient, copies the message into the
        matching user mailbox(es), sends bounces for unknown recipients and
        deletes the staging object. It is irreversible: repeating the call
        after a successful run returns `404 Not Found`.

        This operation is only available when `STORAGE=s3`. With any other
        storage backend it returns `501 Not Implemented`.
      operationId: processEmail
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessEmailRequest'
      responses:
        '200':
          description: The message was processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessEmailResponse'
        '400':
          description: Invalid request (missing or malformed id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The staging object does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Bucket operations are not available for the configured storage backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The message could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/receiver/identities:
    get:
      tags:
      - Support
      summary: List receiving mail identities and their receiver rule coverage
      description: |-
        Lists the receiving mail identities: the verified identities returned
        by the SES `ListIdentities` operation (both domains and individual
        email addresses). `hasRules` is true when the receiver has its own
        rules entry for that identity; otherwise the recipient is routed by
        the `_` fallback. The GUI shows a tick for identities with rules and
        a plus for those without.

        Requires the `ses:ListIdentities` IAM permission. A failed SES query
        returns `502 failed to list SES identities`.
      operationId: listReceiverIdentities
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The SES identities and their rule coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverIdentitiesResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The SES identities could not be listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/receiver/rules:
    get:
      tags:
      - Support
      summary: List the configured receiver rules
      description: |-
        Returns every receiving identity with its own rules entry, including
        the `_` fallback. Each identity has one ordered list of rules evaluated
        first-match-wins.

        The rules are read from the configured receiver config store on every
        request, so this operation also acts as the GUI's **Reload** action.
      operationId: listReceiverRules
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The configured receiver rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverRulesResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The receiver config store could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Support
      summary: Add or update receiver rules
      description: |-
        Adds or replaces the rules entries for the domains in the request.
        Domains not included in the request (in particular the `_` fallback)
        are left untouched. Use `DELETE` on
        `/api/support/receiver/rules/{identity}` to remove an entry.

        Each identity must have at least one rule, and every rule must be a
        known `HandlerRule`. The `_` fallback must remain valid, otherwise the
        request is rejected with `400 Bad Request`. Submitted entries are
        persisted in the configured receiver config store and published to the
        active receiver cache. The updated rules are returned in the response.
      operationId: saveReceiverRules
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiverRulesRequest'
      responses:
        '200':
          description: The saved receiver rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverRulesResponse'
        '400':
          description: Invalid domain or handler rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The receiver config store could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/support/receiver/rules/{identity}:
    delete:
      tags:
      - Support
      summary: Remove a configured receiving identity
      description: |-
        Deletes the rules entry for `identity` from the receiver config store.
        The identity then appears with a plus in the receiving mail identities
        list and is routed by the `_` fallback until rules are added again.
        The response is the full remaining rules list.

        The `_` fallback can never be deleted: every recipient without its own
        entry relies on it, so the operation returns `400 Bad Request` for it.
        Unknown identities return `404 Not Found`.
      operationId: deleteReceiverRules
      security:
      - bearerAuth: []
      parameters:
      - name: identity
        in: path
        required: true
        description: The receiving identity whose rules entry should be removed
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: The rules remaining after the deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverRulesResponse'
        '400':
          description: Invalid identity or an attempt to delete the fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The receiving identity has no rules entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The receiver config store could not be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from login or refresh (requires the systemManager claim)
  schemas:
    ConfigurationsResponse:
      type: object
      required:
      - configurations
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationSummary'
      additionalProperties: false
    ConfigurationSummary:
      type: object
      description: A runtime configuration section and its implementation
      required:
      - name
      - implementation
      properties:
        name:
          type: string
          description: Canonical section name (for example `storage`)
        implementation:
          type: string
          description: Short name of the active implementation (for example `s3`, `ddb` or `memory`)
        description:
          type: string
          description: Human-readable description of the section
      additionalProperties: false
    ConfigurationDetail:
      type: object
      description: Full configuration for one section, with secrets redacted
      required:
      - name
      - implementation
      - settings
      properties:
        name:
          type: string
          description: Canonical section name
        implementation:
          type: string
          description: Short name of the active implementation
        description:
          type: string
          description: Human-readable description of the section
        settings:
          type: object
          description: |-
            Configuration values as strings. Secret values are represented by
            booleans such as `passwordConfigured` and are never included.
          additionalProperties:
            type: string
      additionalProperties: false
    BucketRootResponse:
      type: object
      description: Immediate contents of the configured mail bucket
      required:
      - bucket
      - objects
      - prefixes
      properties:
        bucket:
          type: string
          description: The configured bucket name
        objects:
          type: array
          description: Objects directly under the bucket root (unprocessed staging messages)
          items:
            $ref: '#/components/schemas/BucketObject'
        prefixes:
          type: array
          description: Common prefixes directly under the bucket root (for example `users/`)
          items:
            type: string
      additionalProperties: false
    BucketObject:
      type: object
      description: One object at the bucket root
      required:
      - key
      - size
      - lastModified
      properties:
        key:
          type: string
          description: Object key, suitable for `ProcessEmail`
        size:
          type: integer
          format: int64
          minimum: 0
          description: Object size in bytes
        lastModified:
          type: string
          format: date-time
          description: When the object was last modified
        etag:
          type: string
          description: Object ETag, when reported by S3
      additionalProperties: false
    ProcessEmailRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          minLength: 1
          description: Object key from `GET /api/support/bucket/root`
      additionalProperties: false
    ProcessEmailResponse:
      type: object
      required:
      - success
      - id
      properties:
        success:
          type: boolean
          default: true
        id:
          type: string
          description: The staging object that was processed
        message:
          type: string
          description: Human-readable result message
      additionalProperties: false
    ReceiverIdentitiesResponse:
      type: object
      description: Verified SES identities with their receiver rule coverage
      required:
      - identities
      properties:
        identities:
          type: array
          description: Identities sorted by name; those without a rules entry use the fallback
          items:
            $ref: '#/components/schemas/ReceiverIdentity'
      additionalProperties: false
    ReceiverIdentity:
      type: object
      description: One AWS SES identity and whether the receiver has rules for it
      required:
      - identity
      - hasRules
      properties:
        identity:
          type: string
          description: Verified SES identity (a domain or an individual email address)
        hasRules:
          type: boolean
          description: True when the receiver has its own rules entry for this identity
      additionalProperties: false
    ReceiverRulesResponse:
      type: object
      description: All domains with their own receiver rules entry
      required:
      - rules
      properties:
        rules:
          type: array
          description: Domains sorted by name, each with its ordered rules
          items:
            $ref: '#/components/schemas/ReceiverDomainRules'
      additionalProperties: false
    ReceiverRulesRequest:
      type: object
      description: Rules entries to add or replace; omitted domains are left untouched
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ReceiverDomainRules'
      additionalProperties: false
    ReceiverDomainRules:
      type: object
      description: The ordered rules for one receiving identity; `_` is the base fallback
      required:
      - domain
      - rules
      properties:
        domain:
          type: string
          description: Receiving identity the rules apply to (for example `example.com` or `_`)
          minLength: 1
        rules:
          type: array
          description: Rules evaluated in order until one applies
          items:
            $ref: '#/components/schemas/HandlerRule'
      additionalProperties: false
    HandlerRule:
      type: string
      description: One receiver rule. `DeliverToUser` falls through when the user does not exist; `Drop` discards the message without a bounce.
      enum:
      - DeliverToUser
      - DeliverToMailIdentity
      - Bounce
      - Drop
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: A generic error message
      additionalProperties: false
