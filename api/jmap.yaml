              items:
                type: string
            - type: "null"
        sender:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        from:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        to:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        cc:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        bcc:
