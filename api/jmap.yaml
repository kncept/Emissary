    # ============================================================
    # Email (RFC 8621 Section 4)
    # ============================================================

    EmailAddress:
      type: object
      required: [email]
      properties:
        name:
          type: [string, "null"]
        email:
          type: string
          description: "The email address (may be an empty string only where JMAP permits it)"
      additionalProperties: false

    EmailHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
      additionalProperties: false

    EmailBodyValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
        isEncodingProblem:
          type: boolean
          default: false
        isTruncated:
          type: boolean
          default: false
      additionalProperties: false

    EmailBodyPart:
      type: object
      required: [type, size]
      properties:
        partId:
          type: [string, "null"]
          description: "Null if and only if the part is multipart/*"
        blobId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: "Null if and only if the part is multipart/*"
        size:
          $ref: "#/components/schemas/UnsignedInt"
        headers:
          type: array
          items:
            $ref: "#/components/schemas/EmailHeader"
        name:
          type: [string, "null"]
        type:
          type: string
        charset:
          type: [string, "null"]
        disposition:
          type: [string, "null"]
        cid:
          type: [string, "null"]
        language:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        location:
          type: [string, "null"]
        subParts:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailBodyPart"
            - type: "null"
      additionalProperties: true
      description: |
        A MIME body part. `header:{name}` properties may also be requested or
        supplied, following the Email header-property syntax.

    Email:
      type: object
      description: |
        An Email object. Only `id` is guaranteed in every response; the
        properties returned depend on the `properties` argument to `Email/get`.
        The `header:{name}[:as{form}][:all]` dynamic properties are also
        permitted.
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        blobId:
          $ref: "#/components/schemas/Id"
        threadId:
          $ref: "#/components/schemas/Id"
        mailboxIds:
          $ref: "#/components/schemas/IdBooleanMap"
        keywords:
          $ref: "#/components/schemas/StringBooleanMap"
        size:
          $ref: "#/components/schemas/UnsignedInt"
        receivedAt:
          $ref: "#/components/schemas/UTCDate"
        messageId:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        inReplyTo:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        references:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        sender:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        from:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        to:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        cc:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        bcc:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        replyTo:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        subject:
          type: [string, "null"]
        sentAt:
          oneOf:
            - $ref: "#/components/schemas/Date"
            - type: "null"
        hasAttachment:
          type: boolean
        preview:
          type: string
        bodyStructure:
          $ref: "#/components/schemas/EmailBodyPart"
        bodyValues:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EmailBodyValue"
        textBody:
          type: array
          items:
            $ref: "#/components/schemas/EmailBodyPart"
        htmlBody:
          type: array
          items:
            $ref: "#/components/schemas/EmailBodyPart"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailBodyPart"
        headers:
          type: array
          items:
            $ref: "#/components/schemas/EmailHeader"
      additionalProperties: true

    EmailFilterCondition:
      type: object
      properties:
        inMailbox:
          $ref: "#/components/schemas/Id"
        inMailboxOtherThan:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        before:
          $ref: "#/components/schemas/UTCDate"
        after:
          $ref: "#/components/schemas/UTCDate"
        minSize:
          $ref: "#/components/schemas/UnsignedInt"
        maxSize:
          $ref: "#/components/schemas/UnsignedInt"
        allInThreadHaveKeyword:
          type: string
        someInThreadHaveKeyword:
          type: string
        noneInThreadHaveKeyword:
          type: string
        hasKeyword:
          type: string
        notKeyword:
          type: string
        hasAttachment:
          type: boolean
        text:
          type: string
        from:
          type: string
        to:
          type: string
        cc:
          type: string
        bcc:
          type: string
        subject:
          type: string
        body:
          type: string
        header:
          type: array
          description: "One or two elements: header name, and optional value text"
          minItems: 1
          maxItems: 2
          items:
            type: string
      additionalProperties: false

    EmailFilterOperator:
      type: object
      required: [operator, conditions]
      properties:
        operator:
          type: string
          enum: [AND, OR, NOT]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/EmailFilter"
      additionalProperties: false

    EmailFilter:
      oneOf:
        - $ref: "#/components/schemas/EmailFilterOperator"
        - $ref: "#/components/schemas/EmailFilterCondition"

    EmailGetRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          $ref: "#/components/schemas/Id"
        ids:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Id"
            - type: "null"
        properties:
          oneOf:
            - type: array
