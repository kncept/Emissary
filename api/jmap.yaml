    BlobCopyResponse:
      type: object
      required: [fromAccountId, accountId, copied, notCopied]
      properties:
        fromAccountId:
          $ref: "#/components/schemas/Id"
        accountId:
          $ref: "#/components/schemas/Id"
        copied:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/Id"
            - type: "null"
        notCopied:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/SetError"
            - type: "null"
      additionalProperties: true

    # ============================================================
    # Push (RFC 8620 Section 7)
    # ============================================================

    PushKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          description: "P-256 ECDH public key, URL-safe base64"
        auth:
          type: string
          description: "Authentication secret, URL-safe base64"
      additionalProperties: false

    PushSubscription:
      type: object
      description: |
        A push subscription. `url` and `keys` are omitted by
        `PushSubscription/get` and must not be returned unless explicitly
        requested (which the server rejects with `forbidden`).
      required: [id, deviceClientId, verificationCode, expires, types]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        deviceClientId:
          type: string
        url:
          type: string
          format: uri
          description: "HTTPS URL to which the server POSTs push messages"
        keys:
          oneOf:
            - $ref: "#/components/schemas/PushKeys"
            - type: "null"
        verificationCode:
          type: [string, "null"]
        expires:
          oneOf:
            - $ref: "#/components/schemas/UTCDate"
            - type: "null"
        types:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      additionalProperties: false

    PushSubscriptionCreate:
      type: object
      required: [deviceClientId, url]
      properties:
        deviceClientId:
          type: string
        url:
          type: string
          format: uri
        keys:
          oneOf:
            - $ref: "#/components/schemas/PushKeys"
            - type: "null"
        expires:
          oneOf:
            - $ref: "#/components/schemas/UTCDate"
            - type: "null"
        types:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      additionalProperties: false

    PushSubscriptionUpdate:
      type: object
      properties:
        verificationCode:
          type: string
        expires:
          $ref: "#/components/schemas/UTCDate"
      additionalProperties: false

    PushSubscriptionGetRequest:
      type: object
      properties:
        ids:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Id"
            - type: "null"
        properties:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      additionalProperties: true

    PushSubscriptionGetResponse:
      type: object
      required: [list, notFound]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscription"
        notFound:
          type: array
          items:
            $ref: "#/components/schemas/Id"
      additionalProperties: true

    PushSubscriptionSetRequest:
      type: object
      properties:
        create:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/PushSubscriptionCreate"
            - type: "null"
        update:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/PushSubscriptionUpdate"
            - type: "null"
        destroy:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Id"
            - type: "null"
      additionalProperties: true

    PushSubscriptionSetResponse:
      type: object
      required:
        - created
        - updated
        - destroyed
        - notCreated
        - notUpdated
        - notDestroyed
      properties:
        created:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/PushSubscription"
            - type: "null"
        updated:
          oneOf:
            - type: object
              additionalProperties:
                oneOf:
                  - $ref: "#/components/schemas/PushSubscription"
                  - type: "null"
            - type: "null"
        destroyed:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/Id"
            - type: "null"
        notCreated:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/SetError"
            - type: "null"
        notUpdated:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/SetError"
            - type: "null"
        notDestroyed:
          oneOf:
            - type: object
              additionalProperties:
                $ref: "#/components/schemas/SetError"
            - type: "null"
      additionalProperties: true

    StateChange:
      type: object
      description: "Push notification payload sent on the EventSource connection"
      required: ["@type", changed]
      properties:
        "@type":
          type: string
          const: "StateChange"
        changed:
          type: object
          description: "Map of type name to the new state string"
          additionalProperties:
            type: string
      additionalProperties: false

