name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # For creating releases and uploading assets
  id-token: write  # For signing with cosign (if needed)

env:
  CGO_ENABLED: 0
  GO_VERSION: '1.27.1'
  NODE_VERSION: '24'

jobs:
  test:
    name: Test (Go + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mailer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run tests
        run: ./run.sh test

  build:
    name: Build binaries (linux/amd64)
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      commit_hash: ${{ steps.extract_version.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mailer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          COMMIT_HASH: ${{ steps.extract_version.outputs.commit_hash }}
          BUILD_TIME: ${{ steps.extract_version.outputs.build_time }}
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X github.com/kncept/Emissary/mailer/envutil.CommitHash=${COMMIT_HASH} -X github.com/kncept/Emissary/mailer/envutil.BuildTime=${BUILD_TIME} -X github.com/kncept/Emissary/mailer/envutil.Version=${VERSION}"
          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV
          ./run.sh build

      - name: Verify binaries exist
        run: |
          ls -la .build/
          test -f .build/frontend
          test -f .build/s3-receiver
          test -f mailer/cmd/frontend/bootstrap
          test -f mailer/cmd/s3-receiver/bootstrap

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          # Main binaries
          cp .build/frontend release-artifacts/emissary-frontend-linux-amd64
          cp .build/s3-receiver release-artifacts/emissary-s3-receiver-linux-amd64
          # Lambda bootstraps
          cp mailer/cmd/frontend/bootstrap release-artifacts/emissary-frontend-bootstrap-linux-amd64
          cp mailer/cmd/s3-receiver/bootstrap release-artifacts/emissary-s3-receiver-bootstrap-linux-amd64

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emissary-binaries-${{ steps.extract_version.outputs.version }}
          path: |
            release-artifacts/*
            !release-artifacts/checksums.txt
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: emissary-checksums-${{ steps.extract_version.outputs.version }}
          path: release-artifacts/checksums.txt
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: emissary-binaries-${{ needs.build.outputs.version }}
          path: release-artifacts

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: emissary-checksums-${{ needs.build.outputs.version }}
          path: release-artifacts

      - name: Verify checksums
        run: |
          cd release-artifacts
          sha256sum -c checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Emissary ${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/emissary-frontend-linux-amd64
            release-artifacts/emissary-s3-receiver-linux-amd64
            release-artifacts/emissary-frontend-bootstrap-linux-amd64
            release-artifacts/emissary-s3-receiver-bootstrap-linux-amd64
            release-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}