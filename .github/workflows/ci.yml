name: CI

on:
  # Every commit pushed to any branch (tags are handled by release.yml)
  push:
    branches:
      - '**'
  pull_request:
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Test (Go + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: mailer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run tests
        run: ./run.sh test
